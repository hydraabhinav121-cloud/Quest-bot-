services:
  - type: worker
    name: orbie-premium
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    autoDeploy: true
    disk:
      name: orbie-premium-data
      mountPath: /opt/render/project/src/data
      sizeGB: 1
    envVars:
      - key: DATA_DIR
        value: /opt/render/project/src/data
      - key: BOT_TOKEN
        sync: false
      - key: CLIENT_ID
        sync: false
      - key: TOKEN_SECRET
        sync: false
