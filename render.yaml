services:
  - type: web
    name: questall-bot
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: CLIENT_ID
        sync: false
      - key: OWNER_ID
        value: "985486854159753256"
      - key: GUILD_ID
        value: "1536279239945617529"
      - key: TOKEN_SECRET
        sync: false
      - key: DEV_NAME
        value: shimz
      - key: DATA_DIR
        value: ./data
